 on your tongue reveals it to taste faintly of cherries.","roleplayingEffect":"Until you next perform or participate in a ceremony, and for a short time afterward, you feel remarkably centred. If you are dedicated to a virtue, you feel a strong urge to take action in line with that virtue. If not, you feel a strong urge to take action in keeping with your personal philosophy. The night after drinking this potion you will have particularly vivid dreams.","mechanicalEffect":"The next time you perform or participate in a ceremony of anointing, consecration, hallow, exorcism, excommunication or testimony the effect is one rank higher than normal. You must possess the appropriate skill to take part in the ceremony. The effects last for ten minutes or until you next perform a religious ceremony. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"One dram each of Imperial roseweald and true vervain and one dose of liao.","ingredients":{"imperialRoseweald":1,"trueVervain":1,"liao":1},"totalIngredients":3},{"name":"Waywalker's Suffusion","lore":"Enhances a priest's next ceremony by two ranks, accompanied by auditory hallucinations some believe are the voices of past virtuous incarnations.","form":"Liquid.","description":"When this midnight blue liquid catches the light it seems to glow. It has a light, spicy scent. A tiny droplet of this thin fluid on your tongue reveals it to have a rich, bitter flavour.","roleplayingEffect":"Until you next use a priest skill, and for a short time afterward, you are aware of unseen presences as if you are at the centre of an unseen crowd. Occasionally you hear distant muttering or occasionally a comprehensible word or fragment of a sentence.","mechanicalEffect":"The next time you perform or participate in a ceremony of anointing, consecration, hallow, exorcism, excommunication or testimony the effect is two ranks higher than normal. You must possess the appropriate skill to take part in the ceremony. The effects last for ten minutes or until you next perform a religious ceremony. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of cerulean mazzarine and marrowort, one dram of true vervain and two doses of liao.","ingredients":{"ceruleanMazzarine":2,"marrowort":2,"trueVervain":1,"liao":2},"totalIngredients":7},{"name":"Shadowcrow Infusion","lore":"Adapted from a Kallavesi remedy for troubled minds; blocks use of liao and religious skills, controversially enough that some in the Synod have sought to ban it.","form":"Infusion.","description":"This glimmering silver liquid has a light scent reminiscent of cloves. Tasting it reveals it to have a sharp bitter flavour that is never-the-less quite appealing.","roleplayingEffect":"Inhaling this infusion causes a momentary anguish, like the sudden separation from a loved one, but there are no other immediate effects.","mechanicalEffect":"Inhaling the steam from this infusion causes your aura to become impossible to read with the insight ceremony or similar effects. You are also unable to make use of liao, true liao, or any religious skill. The effects last until the next sunrise. If you are human, any time you sleep under the influence of the potion, you either do not dream or do not remember your dreams. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"One dram of marrowort and one dose of liao.","ingredients":{"marrowort":1,"liao":1},"totalIngredients":2}]},{"id":"tonics-of-the-deep-forest","name":"Tonics of the Deep Forest","url":"https://www.profounddecisions.co.uk/empire-wiki/Tonics_of_the_Deep_Forest","intro":"The Tonics of the Deep Forest grant vigour and health. These preparations use alcohol as a base, and are usually very strong tasting. They are especially popular among the Varushkans, who mix them with raw spirits and flavour them with strong honey. Some Freeborn Kohan are leery of using the Winterskin and Ironblood tonics due to the way they dampen strong passions. By contrast, many landsknechts and schlacta appreciate the way these elixirs help them suppress feelings of fear, empathy or compassion.","potions":[{"name":"Oakenhide Tonic","lore":"Grants an additional rank of endurance and steadies a fighter's nerve, especially valued by untried troops.","form":"Liquid.","description":"This deep golden liquid looks a little like watered-down honey. It has an alcoholic scent, and a tiny droplet of the sticky fluid on your tongue tastes strongly of apples.","roleplayingEffect":"You feel very confident in your ability to survive dangerous situations.","mechanicalEffect":"You gain an additional rank of endurance until the next sunrise. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"One dram of true vervain and one dram of bladeroot.","ingredients":{"bladeroot":1,"trueVervain":1},"totalIngredients":2},{"name":"Winterskin Tonic","lore":"Grants two ranks of endurance while numbing pain and distancing the drinker from their emotions.","form":"Liquid.","description":"When this golden-brown liquid catches the light, it seems almost to glow. It has a strongly alcoholic scent, but tastes sweet - like butterscotch. Place a tiny drop on your finger or your tongue, and the tip quickly becomes numb.","roleplayingEffect":"You feel distanced from your emotions, as if they were being experienced by someone else.","mechanicalEffect":"You gain two additional ranks of endurance until the next sunrise. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams of cerulean mazzarine, one dram each of true vervain and bladeroot.","ingredients":{"bladeroot":1,"ceruleanMazzarine":2,"trueVervain":1},"totalIngredients":4},{"name":"Ironblood Tonic","lore":"Grants three ranks of endurance at the cost of empathy; associated with cruelty and, with prolonged use, lasting emotional damage.","form":"Liquid.","description":"This golden-brown liquid clings viscously to the inside of the container if you shake it. It smells faintly of apples, but a tiny drop on your tongue reveals it to have a strangely salty flavour.","roleplayingEffect":"You find it very hard to care about the feelings of other people, and tend to take the most expedient course of action regardless of who it might hurt.","mechanicalEffect":"You gain three additional ranks of endurance until the next sunrise. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams of marrowort, two drams each of true vervain and cerulean mazzarine, and one dram of bladeroot.","ingredients":{"bladeroot":1,"ceruleanMazzarine":2,"marrowort":3,"trueVervain":2},"totalIngredients":8}]},{"id":"tonics-of-the-open-sky","name":"Tonics of the Open Sky","url":"https://www.profounddecisions.co.uk/empire-wiki/Tonics_of_the_Open_Sky","intro":"The Tonics of the Open Sky are useful preparations that slow bleeding and help mitigate injury. They allow a severely injured warrior finds it easier to endure their wounds, granting valuable time for a healer or chirurgeon to reach them. More than one veteran is alive today because of one of these preparations, and they are often referred to as elixirs of lifekeeping as a consequence.\n\nThe herbs used to brew these potions are dissolved in a small amount of alcohol. Unlike the harsher Tonics of the Deep Forest, the tonics of the open sky require a much weaker solution and usually possess a more mellow flavour. The recipes originated in the Brass Coast in pre-Imperial times. While they were initially a secret of the Riqueza family, the method of brewing these lifesaving tonics quickly spread to the other Freeborn families. In the decades before the formation of the Empire, Freeborn merchants engaged in a lucrative trade in selling them to foreign warriors. After the Brass Coast joined the Empire it was only a matter of time before the recipes became generally known. To pre-empt this, a family of the Riqueza simultaneously sold the formulae to no fewer than fourteen apothecaries in various nations, often through intermediaries, for quite astronomical sums of money. When challenged, their dhomiro simply shrugged, and said it was better to sell something while it still had value than to allow it to be stolen.\n\nIn Wintermark, these tonics are collectively termed the Grimnir's Cloak. According to a popular legend, Grimnir Kaisa Bloodwing served the potion to all the warriors of her Hall before a vicious battle against a besieging orc force. Her foresight meant that the healers were able to save more warriors than the orcs were able to bring down, patch them up, and return them to the fray. In the end the defending forces were victorious. While some historians question the veracity of this story, few can dispute the deeper truth - that no matter how wounded someone may be, if a healer can reach them in time, they can be saved.","potions":[{"name":"Tonic of Sunlit Glass","lore":"Grants a rank of fortitude and a surge of battlefield optimism.","form":"Liquid.","description":"When this translucent yellow-gold liquid catches the light it seems almost to glow. It has a faint scent of lemons, and a tiny drop on your tongue tastes of freshly squeezed oranges.","roleplayingEffect":"You feel a sudden burst of optimism and a rush of positive emotions; you are reminded of past triumphs, hopes and dreams.","mechanicalEffect":"You gain an additional rank of fortitude until the next sunrise. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"One dram each of cerulean mazzarine and Imperial roseweald.","ingredients":{"ceruleanMazzarine":1,"imperialRoseweald":1},"totalIngredients":2},{"name":"Tonic of Surging Flame","lore":"Grants a free use of the Unstoppable skill, though it dulls the drinker's self-preservation instinct.","form":"Liquid.","description":"This thin tangerine liquid has a thick layer of darker sediment at the bottom; shake the container and it quickly settles down again. It smells strongly of apricots - or perhaps oranges - and has a tart, citrus taste.","roleplayingEffect":"Warmth spreads from your stomach to your entire body, and persists for the duration of the effect. It brings with it feelings of absolute confidence in your ability to survive no matter what happens. You find it hard to remember that risky behaviour might result in permanent injury or death.","mechanicalEffect":"Once today you may use the unstoppable skill as if you know it without spending hero points. The effect remains until used or until the next sunrise. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of Imperial roseweald and true vervain, and one dram of cerulean mazzarine.","ingredients":{"ceruleanMazzarine":1,"imperialRoseweald":2,"trueVervain":2},"totalIngredients":5},{"name":"Tonic of the Distant Shore","lore":"Named for a Freeborn tale of the corsair Bolivar i Riqueza outwitting Death; can triple bleeding-out time and grants three ranks of fortitude.","form":"Liquid.","description":"When this cherry-red liquid catches the light it seems to glow. A droplet of this sticky fluid on your fingertip stains it a deep crimson. It smells strongly of fresh berries and has a sweet, dry, fruity flavour.","roleplayingEffect":"You feel a sudden burst of optimism and renewed hope; feelings of worry, doubt and uncertainty are banished.","mechanicalEffect":"You gain an additional three ranks of fortitude until the next sunrise. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of Imperial roseweald and marrowort, and one dram of cerulean mazzarine.","ingredients":{"ceruleanMazzarine":1,"imperialRoseweald":2,"marrowort":2},"totalIngredients":5}]},{"id":"tinctures-of-true-eminence","name":"Tinctures of True Eminence","url":"https://www.profounddecisions.co.uk/empire-wiki/Tinctures_of_True_Eminence","intro":"Mastery of these recipes allows an apothecary to brew preparations valuable to ritual magicians versed in the Lore of Summer. With one of these potions a ritualist can wield the magic of the Summer realm more effectively, but they also become more susceptible to the influence of that realm.\n\nBefore the Druj orcs were driven from Reikos in 379YE, masters of the Tinctures of True Eminence knew how to brew two potions - Dragon's Blood and Goldencrown. During the liberation of Haros Water and Riverwatch, documents captured from the orcs gave tantalizing hints regarding a new potion that granted orc ghulai incredible proficiency with certain battlefield magics. A cadre of unconquered working closely with Navarr scouts, tracked down further details and eventually, with the aid of Dawnish war witches attached to the Eastern Sky cornered and defeated one of the Stone Toad Tepel in a ruined chapterhouse in Longshire. With the savage herbalist's notes in hand, Imperial apothecaries were able to deduce the recipe for Firewine, a powerful aid to the performance of Summer magic. Unselfishly, the soldiers involved in recovering these notes chose to share the information about how to make this potion with the rest of the Empire and the recipe - based on principles familiar to anyone who had mastered the Tinctures - quickly spread.","potions":[{"name":"Dragon's Blood","lore":"A flammable Summer tincture some magicians ignite before drinking; easy to become reliant on its confidence-boosting power.","form":"Liquid.","description":"This red elixir smells of oranges and glows with an inner radiance when it catches the light. The scent makes your nostrils tingle and warms your chest. The tangy flavour makes you want to down the entire potion.","roleplayingEffect":"You are filled with personal pride and self-assurance. Any contradiction or lack of respect is profoundly annoying, and you find it difficult to tolerate mockery, insolence or being treated as if you are unimportant.","mechanicalEffect":"If you possess the Summer Lore skill then you gain one additional effective rank to the next Summer ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of cerulean mazzarine and true vervain, one dram of Imperial roseweald, and one crystallised mana.","ingredients":{"ceruleanMazzarine":2,"imperialRoseweald":1,"trueVervain":2,"manaCrystal":1},"totalIngredients":6},{"name":"Goldencrown","lore":"First brewed by Polina di Temeschwar for the Bloodgold carta; the formula was later stolen — along with her heart — by a disguised Dawnish noble seeking to join House Ayen.","form":"Liquid.","description":"When this beautiful golden elixir catches the light it glows with an inner radiance. If the container is shaken, the liquid within hisses and bubbles energetically. It smells strongly of apples and pears. A tiny droplet on your tongue reveals it to have a delicious, fruity flavour that leaves you with a strong desire to drink the entire thing, savouring every mouthful.","roleplayingEffect":"You feel a strong urge to take charge of any situation you find yourself in. Filled with pride and self-confidence, people who disagree with you or disrespect you make you exceptionally angry. Whatever you are doing, you very much want to be the centre of attention.","mechanicalEffect":"If you possess the Summer Lore skill then you can use up to 3 personal mana as if it were crystal mana on the next Summer ritual that you perform within ten minutes.","recipe":"Three drams of cerulean mazzarine, two drams of Imperial roseweald, and one dram each of true vervain, bladeroot and marrowort.","ingredients":{"bladeroot":1,"ceruleanMazzarine":3,"imperialRoseweald":2,"marrowort":1,"trueVervain":1},"totalIngredients":8},{"name":"Firewine","lore":"A fiery, anger-inducing Summer tincture requiring unusually large amounts of Imperial roseweald to brew.","form":"Liquid.","description":"This syrupy russet liquid smells very alcoholic. A droplet on your tongue brings an overwhelming taste of strong spirits and fermented fruit. Even a small amount makes your heart beat faster for a few moments.","roleplayingEffect":"You experience a rush of heat that flows down your throat and boils in your stomach. When you feel thwarted, belittled, or wronged you find it hard to avoid becoming enraged. If you are actually insulted, disrespected, or threatened you experience an urge to respond violently.","mechanicalEffect":"If you possess the Summer Lore skill then you gain three additional ranks to the next Summer ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams each of Imperial roseweald and true vervain, one dram of cerulean mazzarine, one crystallised mana, and one ring of ilium.","ingredients":{"ceruleanMazzarine":1,"imperialRoseweald":3,"trueVervain":3,"manaCrystal":1,"ilium":1},"totalIngredients":9}]},{"id":"unguents-of-falling-leaves","name":"Unguents of Falling Leaves","url":"https://www.profounddecisions.co.uk/empire-wiki/Unguents_of_Falling_Leaves","intro":"Mastery of these recipes allows an apothecary to brew preparations valuable to ritual magicians versed in the lore of Autumn. With one of these potions a ritualist can wield the magic of the Autumn realm more effectively, but they also become more susceptible to the influence of that realm.\n\nSince the formation of the Empire, those apothecaries who had mastered the Unguents of Falling Leaves knew how to brew two potions - Bronze Spider Balsam and Leaden Quicksilver. There had been plenty of stories of other, more potent, potions but such preparations were invariably extremely difficult to get hold of and prohibitively expensive to secure when they were available at all. Following the fall of Reikos in 379YE, however, writings kept by several Tepel fell into the hands of Imperial scouts who discovered the details of the recipe for Essence of Verdigris. There were some early attempts to keep the information as a proprietary secret, but those efforts were ruined when a second recipe came to like during the liberation of the Great Forest at Reikos. One of the Highborn slaves forced to work the weirwood forests by the savage orcs had possession of a copy stolen at great risk from their Druj masters, and immediately shared it with not only her liberators, but any other Imperial who wished to learn it. \"After all,\" she said, \"it would be nice if something good might grow out of all this horror.\"","potions":[{"name":"Bronze Spider Balsam","lore":"A metallic salve painted in web-like patterns to focus the mind on Autumn's branching pathways and webs of influence.","form":"Salve.","description":"This copper-brown ointment glows when it catches the light. If rubbed on the fingers it releases a strong, spicy scent and is quickly absorbed into your skin. It is hard to resist the urge to rub the entire pot onto your skin.","roleplayingEffect":"You are driven to match wits with those around you, and try to gain influence over them. You become acutely aware of anyone who owes you a favour, or to whom you in turn might owe a favour.","mechanicalEffect":"If you possess the Autumn lore skill then you gain one additional effective rank to the next Autumn ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of cerulean mazzarine and marrowort, one dram of true vervain and one crystallised mana.","ingredients":{"ceruleanMazzarine":2,"marrowort":2,"trueVervain":1,"manaCrystal":1},"totalIngredients":6},{"name":"Leaden Quicksilver","lore":"A heavy, chilling salve that sharpens single-minded focus on personal goals through Autumn magic.","form":"Salve.","description":"When this smooth, metallic-grey ointment catches the light it glows with a cold, reflective light. The firm texture feels like metal when rubbed between finger and thumb. It chills your flesh where it touches exposed skin.","roleplayingEffect":"You become highly motivated to pursue and achieve your goals, whatever they may be. Anything that stands in the way of your success is an obstacle to be overcome, although you feel an urge to avoid personal physical confrontation. Other people should follow your advice because you alone know what is best for them. Anyone who refuses to heed your suggestions is probably plotting against you.","mechanicalEffect":"If you possess the Autumn lore skill then you can use up to 3 personal mana as if it were crystal mana on the next Autumn ritual that you perform within ten minutes.","recipe":"Three drams of cerulean mazzarine, two drams of marrowort and one dram each of Imperial roseweald, bladeroot and true vervain.","ingredients":{"bladeroot":1,"ceruleanMazzarine":3,"imperialRoseweald":1,"marrowort":2,"trueVervain":1},"totalIngredients":8},{"name":"Essence of Verdigris","lore":"Known as Gamemaster's Patina in captured Druj notes; a complex, hard-to-brew salve that sharpens the mind but permanently stains the skin with green-blue residue over time.","form":"Salve.","description":"This thick blue-green paste has a rough, coarse texture. Rubbed between finger and thumb, it smears easily and releases a strong smell of vinegar and copper.","roleplayingEffect":"You feel an urge to test your skills against others. It is easy to become contrary and stubborn, to try and force people into competing with you. Only the competition matters - winning or losing is irrelevant.","mechanicalEffect":"If you possess the Autumn lore skill then you gain three additional ranks to the next Autumn ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams each of cerulean mazzarine and marrowort, one dram of true vervain, one crystallised mana, and one ring of ilium.","ingredients":{"ceruleanMazzarine":3,"marrowort":3,"trueVervain":1,"manaCrystal":1,"ilium":1},"totalIngredients":9}]},{"id":"unshackled-gift","name":"Unshackled Gift","url":"https://www.profounddecisions.co.uk/empire-wiki/Unshackled_Gift","intro":"These preparations originate with the Druj orcs (or perhaps with the orcs of the Great Forest depending on who one asks). Along with the Double-sided Blade and The Last Resort, these recipes were originally captured from the Druj during the liberation of Reikos, when the herbal text of the Buruk Tepel of the Stone Toad clan fell into Imperial hands. Originally hidden behind a complex cipher, the book was eventually decoded by Imperial scholars and the recipes within revealed.\n\nIn Autumn 382YE, the recipes that comprise the Unshackled Gift were distributed to Imperial apothecaries by order of the Senate. along with several other new potion recipes. Known as the Bonds of the Bridge among the Druj, the potions were also apparently part of the herbal lore of the Great Forest orcs - who know them as the Dance of the Leaves, and shared the recipes with the Highborn and Navarr as thanks for their assistance establishing themselves in Therunin.\n\nEach of these infusions is unique among potions known to Imperial apothecaries in that they are effective only when consumed by orcs. Humans who try to use one of these preparations merely become ill - potentially life-threateningly so. The Druj claim that they serve to help the orc who uses them to make a closer connection with their ancestors, and by engaging in a subconscious communion with these spirits the living orc gains great physical or spiritual strength. The potions have not been in use long enough for proper experimentation to have taken place, but it seems at least circumstantially that the four potions do indeed heighten awareness of the ancestral voices that all orcs hear.","potions":[{"name":"Ancestor's Word","lore":"Known as Butcher's Gate or Budding Leaf; sickens humans but fills a willing orc with ancestral battle-fury and an extra hero point.","form":"Infusion.","description":"This granular red powder is full of sharp fragments that draw blood if rubbed between finger and thumb.","roleplayingEffect":"You feel a surge of physical aggression building. You are strongly aware of the voices of your ancestors, urging you to fight and take joy in battle. If you are human you feel dizzy, and a burning pain spreads through your body.","mechanicalEffect":"If you are a human, you become subject to VENOM and the potion has no other effect. If you are an orc, you gain an additional hero point. In addition, this counts as a source of spiritual strength to overcome roleplaying effects. The effects last until the end of the next skirmish, battle, or quest. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams of Imperial roseweald, one dram of true vervain.","ingredients":{"imperialRoseweald":2,"trueVervain":1},"totalIngredients":3},{"name":"Legionnaire's Will","lore":"Known as Tukai's Haven or Summer Bloom; sickens humans but fills a willing orc with a powerful sense of kinship, granting two hero points.","form":"Infusion.","description":"This deep purple powder crumbles easily between finger and thumb. It has a strong scent that is familiar but impossible to place.","roleplayingEffect":"If you are human you feel a sudden crippling fear and confusion. If you are an orc you feel a sudden bond of connection to those you trust. You are strongly aware of the voices of your ancestors, urging you to revel in the company of other orcs.","mechanicalEffect":"If you are a human, you become subject to VENOM and the potion has no other effect. If you are an orc, you gain two additional hero points. In addition, this counts as a source of spiritual strength to overcome roleplaying effects. The effects last until the end of the next skirmish, battle, or quest. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams of Imperial roseweald, and one dram each of true vervain and marrowort.","ingredients":{"imperialRoseweald":3,"marrowort":1,"trueVervain":1},"totalIngredients":5},{"name":"Indomitable Might","lore":"Known as Chikkad's Scream or Autumn's Gall; sickens humans but grants a willing orc supernatural endurance via the Unstoppable skill.","form":"Infusion.","description":"This greasy dark brown resin is difficult to break apart, and smells of cooked meat.","roleplayingEffect":"If you are human you feel a sudden vertigo and lose your balance. If you are an orc, you are filled with the certainty that you are not alone. You are strongly aware of the voice of an ancestor, urging you to survive no matter the cost.","mechanicalEffect":"If you are a human, you become subject to WEAKNESS and the potion has no other effect. If you are an orc, you gain the ability to use the Unstoppable skill as if you know it. The effects last until the end of the next skirmish, battle, or quest. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of marrowort and true vervain, and one dram of Imperial roseweald.","ingredients":{"imperialRoseweald":1,"marrowort":2,"trueVervain":2},"totalIngredients":5},{"name":"Skar's Strength","lore":"Known as Pakad's Path or Winter's Breath; sickens humans but grants a willing orc mastery of devastating melee skills (Cleaving Strike, Mighty Strikedown, Mortal Blow).","form":"Infusion.","description":"This thick green resin crumbles easily between finger and thumb. It is marked with golden speckles, and smells of spilled blood.","roleplayingEffect":"If you are human you feel a sudden crippling fear and confusion. If you are an orc, you feel a sense of your own power surge through you. You are strongly aware of the voices of your ancestors, urging you to take the lead.","mechanicalEffect":"If you are a human, you become subject to VENOM and the potion has no other effect. If you are an orc, you gain the ability to use the Cleaving Strike, Mighty Strikedown, and Mortal Blow skills as if you know them. The effects last until the end of the next skirmish, battle, or quest. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams of Imperial roseweald, two drams each of true vervain and marrowort, and one dram each of cerulean mazzarine and bladeroot.","ingredients":{"bladeroot":1,"ceruleanMazzarine":1,"imperialRoseweald":3,"marrowort":2,"trueVervain":2},"totalIngredients":9}]}];
</script>
<script>
function toTitleCase(key) {
    return key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
}

function formatIngredients(ingredients) {
    return Object.entries(ingredients)
        .map(([key, qty]) => `${qty}x ${toTitleCase(key)}`)
        .join(', ');
}

function flattenPotions(sets) {
    const all = [];
    for (const set of sets) {
        for (const potion of set.potions) {
            all.push({ setId: set.id, setName: set.name, ...potion });
        }
    }
    return all;
}

function renderDetails(potion) {
    const fields = [
        ['Set', potion.setName],
        ['Form', potion.form],
        ['Description', potion.description],
        ['Roleplaying Effect', potion.roleplayingEffect],
        ['Mechanical Effect', potion.mechanicalEffect],
        ['Recipe', potion.recipe],
        ['Ingredients', formatIngredients(potion.ingredients)],
        ['Lore', potion.lore],
    ];
    return fields
        .filter(([, value]) => value)
        .map(([label, value]) => `<dt>${label}</dt><dd>${value}</dd>`)
        .join('');
}

function shuffle(array) {
    const copy = array.slice();
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

const allPotions = flattenPotions(POTION_SETS);
let score = { correct: 0, total: 0 };

function buildQuestion() {
    const target = allPotions[Math.floor(Math.random() * allPotions.length)];

    // Every potion whose description is an exact match is an acceptable
    // answer — some potions (mostly odourless, tasteless poisons) are
    // genuinely indistinguishable from their description alone.
    const correctNames = allPotions
        .filter(p => p.description === target.description)
        .map(p => p.name);

    const decoyPool = shuffle(allPotions.filter(p => p.description !== target.description));
    const decoysNeeded = Math.max(1, 4 - correctNames.length);
    const decoyNames = [];
    for (const candidate of decoyPool) {
        if (!decoyNames.includes(candidate.name)) {
            decoyNames.push(candidate.name);
        }
        if (decoyNames.length === decoysNeeded) break;
    }

    const options = shuffle([...correctNames, ...decoyNames]);
    return { target, description: target.description, correctNames, options };
}

const detailsBtn = document.getElementById('details-btn');
const detailsPanel = document.getElementById('details-panel');

function renderQuestion() {
    const question = buildQuestion();
    document.getElementById('potion-description').textContent = question.description;

    const choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    document.getElementById('next-btn').style.display = 'none';
    const tieNote = document.getElementById('tie-note');
    tieNote.style.display = 'none';
    detailsBtn.style.display = 'none';
    detailsPanel.style.display = 'none';
    detailsPanel.innerHTML = '';
    detailsBtn.textContent = 'Show details';

    for (const option of question.options) {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = option;
        btn.addEventListener('click', () => {
            const buttons = choicesEl.querySelectorAll('.choice');
            buttons.forEach(b => b.disabled = true);

            score.total++;
            const wasCorrect = question.correctNames.includes(option);
            if (wasCorrect) score.correct++;

            buttons.forEach(b => {
                if (question.correctNames.includes(b.textContent)) {
                    b.classList.add('correct');
                } else if (b === btn) {
                    b.classList.add('wrong');
                }
            });

            document.getElementById('score').textContent = `Score: ${score.correct} / ${score.total}`;
            if (question.correctNames.length > 1) {
                tieNote.textContent = `These ${question.correctNames.length} potions share this exact description — any of them counted as correct.`;
                tieNote.style.display = 'block';
            }
            document.getElementById('next-btn').style.display = 'inline-block';
            detailsBtn.style.display = 'inline-block';
            detailsPanel.innerHTML = renderDetails(question.target);
        });
        choicesEl.appendChild(btn);
    }
}

detailsBtn.addEventListener('click', () => {
    const showing = detailsPanel.style.display === 'block';
    detailsPanel.style.display = showing ? 'none' : 'block';
    detailsBtn.textContent = showing ? 'Show details' : 'Hide details';
});

document.getElementById('next-btn').addEventListener('click', renderQuestion);
renderQuestion();
</script>
