<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Is This Potion?</title>
<style>
    :root {
        --bg: #14141f;
        --card: #1e1e2e;
        --border: #33334a;
        --text: #e8e8f0;
        --muted: #9090a8;
        --accent: #7c8cf0;
        --correct: #4caf6d;
        --wrong: #e0596a;
        font-family: system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
    }
    main {
        width: 100%;
        max-width: 640px;
    }
    .score {
        text-align: right;
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem;
    }
    .prompt {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 0 0 0.5rem;
    }
    .description {
        font-size: 1.15rem;
        line-height: 1.5;
        margin: 0 0 1.75rem;
    }
    .choice {
        display: block;
        width: 100%;
        text-align: left;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 0.85rem 1rem;
        margin-bottom: 0.6rem;
        font-size: 0.95rem;
        cursor: pointer;
    }
    .choice:hover:not(:disabled) {
        background: rgba(124, 140, 240, 0.12);
        border-color: var(--accent);
    }
    .choice:disabled {
        cursor: default;
    }
    .choice.correct {
        background: rgba(76, 175, 109, 0.15);
        border-color: var(--correct);
    }
    .choice.wrong {
        background: rgba(224, 89, 106, 0.15);
        border-color: var(--wrong);
    }
    .note {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 1rem;
        display: none;
    }
    .next {
        margin-top: 1.5rem;
        margin-right: 0.6rem;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 0.7rem 1.4rem;
        font-size: 0.95rem;
        cursor: pointer;
        display: none;
    }
    .details-btn {
        margin-top: 1.5rem;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.7rem 1.4rem;
        font-size: 0.95rem;
        cursor: pointer;
        display: none;
    }
    .details-btn:hover {
        border-color: var(--accent);
    }
    .details {
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        display: none;
        font-size: 0.9rem;
        line-height: 1.6;
    }
    .details dt {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-top: 1rem;
    }
    .details dt:first-child {
        margin-top: 0;
    }
    .details dd {
        margin: 0.2rem 0 0;
    }
</style>
</head>
<body>
<main>
    <div class="score" id="score">Score: 0 / 0</div>
    <div class="card">
        <p class="prompt">What potion is this&hellip;</p>
        <p class="description" id="potion-description"></p>
        <div id="choices"></div>
        <p class="note" id="tie-note"></p>
        <button class="next" id="next-btn">Next potion &rarr;</button>
        <button class="details-btn" id="details-btn">Show details</button>
        <dl class="details" id="details-panel"></dl>
    </div>
</main>
<script>
const POTION_SETS = [{"id":"apothecary-potions","name":"Apothecary Potions","url":"https://www.profounddecisions.co.uk/empire-wiki/Apothecary_Potions","intro":"Every apothecary knows how to mix these five essential preparations. They allow the drinker to gain medicinal aid without needing the personal attention of a physick.","potions":[{"name":"Anodyne Analgesic","lore":"Replaces the older Anodyne Embrocation; masks a wound's pain without treating it, which has led more than one soldier to ignore an injury that needed real medical attention.","form":"Philtre.","description":"This dark blue elixir has a gritty, slightly sandy texture. It smells strongly of freshly cut grass. Put a tiny drop on your finger or your tongue, and the tip quickly becomes numb.","roleplayingEffect":"The liquid numbs the pain of your injuries, and provides an invigoration that quickly clears your mind.","mechanicalEffect":"You can overcome the roleplaying effect of a single traumatic wound of your choice until the end of the current engagement.","recipe":"One dram of marrowort and one dram of true vervain.","ingredients":{"marrowort":1,"trueVervain":1},"totalIngredients":2},{"name":"Bloodharrow Philtre","lore":"A toxic elixir that purges venom and minor poisons through a moment of agonising pain.","form":"Philtre.","description":"This translucent red liquid has tiny white particles suspended in it. It has a spicy scent, and a tiny amount on your tongue or your finger tingles unpleasantly for a moment.","roleplayingEffect":"Pain spreads rapidly through your body; you feel as if your blood is on fire. After a moment or two, the pain fades.","mechanicalEffect":"You lose the venom condition.","recipe":"One dram Imperial roseweald and one dram of marrowort.","ingredients":{"imperialRoseweald":1,"marrowort":1},"totalIngredients":2},{"name":"Elixir Vitae","lore":"A common, widely-carried healing elixir made from true vervain that restores health and vitality.","form":"Philtre.","description":"This translucent liquid is tinted a pale blue-green. It has a clean, fresh scent. A tiny drop of the sticky fluid on your tongue or your finger tingles pleasantly for a moment.","roleplayingEffect":"A warm glow spreads quickly through your body, removing pain, revitalising your spirit and creating a sense of enormous well-being.","mechanicalEffect":"You regain up to three lost hits.","recipe":"One dram of true vervain and one dram of cerulean mazzarine.","ingredients":{"ceruleanMazzarine":1,"trueVervain":1},"totalIngredients":2},{"name":"Feverfail Elixir","lore":"Drives out lingering enervation; useful for treating tiredness or dizziness.","form":"Philtre.","description":"This translucent grey liquid smells faintly of spring flowers. A tiny drop of the thick, syrupy fluid on your tongue causes a grimace - it tastes a little like spoiled milk.","roleplayingEffect":"You feel nauseous. A dizzying chill spreads through your body, leaving you incapacitated for a few moments. Both effects clear as quickly as they arose, leaving you feeling revitalised.","mechanicalEffect":"You lose the weakness condition.","recipe":"One dram of bladeroot and one dram of Imperial roseweald.","ingredients":{"bladeroot":1,"imperialRoseweald":1},"totalIngredients":2},{"name":"Ossean Solution","lore":"Distilled from the older Ossean Balm, this restores ruined limbs and seems to intuitively repair whichever limb benefits the drinker most — a trait apothecaries still debate.","form":"Philtre.","description":"This thick, odourless, blue liquid has a gritty texture. When you rub it between finger and thumb it leaves a crusty residue that soon flakes away. It tastes disgusting.","roleplayingEffect":"You feel a numbness spreading through the flesh of your ruined limb as the torn ligaments and broken bones fuse together.","mechanicalEffect":"You regain the use of a single limb that has been ruined by cleave or impale.","recipe":"One dram of cerulean mazzarine and one dram of bladeroot.","ingredients":{"bladeroot":1,"ceruleanMazzarine":1},"totalIngredients":2}]},{"id":"balms-of-the-fountainhead","name":"Balms of the Fountainhead","url":"https://www.profounddecisions.co.uk/empire-wiki/Balms_of_the_Fountainhead","intro":"Mastery of these recipes allows an apothecary to brew preparations valuable to ritual magicians versed in the lore of Spring. With one of these potions a ritualist can wield the magic of the Spring realm more effectively, but they also become more susceptible to the influence of that realm.\n\nInitially, Imperial apothecaries who had mastered the Balms of the Fountainhead were able to create the Vernal Balm and Suffusion of Blood. However, following the defeat of the Druj orcs in Reikos in 379YE, information about certain techniques used by the Buruk Tepel came to light - coupled with the recovery of a number of books belonging to skilled Highborn apothecaries stolen by the occupation force. These writings contained details of a potent potion favoured by the Druj ghulai that built on the principles already familiar to Imperial potion makers, and knowledge of how to create the Talonvine Infusion quickly spread.","potions":[{"name":"Vernal Balm","lore":"A narcotic balm painted onto the skin before Spring rituals; strips away complexity and frees the user from emotional restraint.","form":"Salve.","description":"This blood-red ointment smells delicious. It has an oily, greasy texture if you rub it between finger and thumb, and it is quickly absorbed into your skin causing your entire hand to tingle.","roleplayingEffect":"You become prone to sudden mood shifts and displays of strong emotion. Your attitudes become more straightforward, and you find complex plans and overthinking frustrating. You would rather take action than talk about it.","mechanicalEffect":"If you possess the Spring lore skill then you gain one additional effective rank to the next Spring ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of Imperial roseweald and marrowort, one dram of true vervain and one crystallised mana.","ingredients":{"imperialRoseweald":2,"marrowort":2,"trueVervain":1,"manaCrystal":1},"totalIngredients":6},{"name":"Suffusion of Blood","lore":"Lets a ritualist channel Spring power directly; the intense thrill is known to be addictive, as in the cautionary tale of Angelique von Tassato.","form":"Liquid.","description":"When this blood-red elixir catches the light, it glows with a faintly translucent aura. The scent smells of freshly cut grass, and causes your nostrils to tingle. The sweet, fruity taste causes a moment of dizziness.","roleplayingEffect":"You become very direct, preferring to go directly to the heart of a problem, say what you think, or deal with immediate problems. You find it difficult to think about the past, or anything more pressing than the immediate future. You also become emotionally volatile, and are especially short-tempered. Anything that frustrates or irritates you is likely to cause you to lash out against its source.","mechanicalEffect":"If you possess the Spring lore skill then you can use up to 3 personal mana as if it were crystal mana on the next Spring ritual that you perform within ten minutes.","recipe":"Three drams of Imperial roseweald, two drams of true vervain, and one dram each of cerulean mazzarine, marrowort and bladeroot.","ingredients":{"bladeroot":1,"ceruleanMazzarine":1,"imperialRoseweald":3,"marrowort":1,"trueVervain":2},"totalIngredients":8},{"name":"Talonvine Infusion","lore":"A mildly toxic inhaled steam, discovered in texts captured during the liberation of Reikos, that gives an exhilarating — and seductive — rush of vitality.","form":"Infusion.","description":"This coarse yellow substance gives off a musty scent. It raises itchy welts similar to nettle stings on contact with skin. It tastes sweet, but causes a painful swelling on the tongue - as if one had been stung by a wasp.","roleplayingEffect":"If you have inhaled the steam or smoke, you feel a rush of vitality and strength that quickly fades but leaves a powerful desire to take action - without concern for rules or long-term consequences. If instead you ate this substance, you experience stabbing stomach pains (consult a ref).","mechanicalEffect":"If you possess the Spring lore skill then you gain three additional ranks to the next Spring ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams each of Imperial roseweald and marrowort, one dram of true vervain, one crystallised mana, and one ring of ilium.","ingredients":{"imperialRoseweald":3,"marrowort":3,"trueVervain":1,"manaCrystal":1,"ilium":1},"totalIngredients":9}]},{"id":"decoctions-of-hoarfrost","name":"Decoctions of Hoarfrost","url":"https://www.profounddecisions.co.uk/empire-wiki/Decoctions_of_Hoarfrost","intro":"Mastery of these recipes allows an apothecary to brew preparations valuable to ritual magicians versed in the lore of Winter. With one of these potions a ritualist can wield the magic of the Winter realm more effectively, but they also become more susceptible to the ambiguous influences of that realm.\n\nImperial apothecaries who mastered the Decoctions of Hoarfrost were able to create the Hungry Moon and Barren Watchtower. There were always rumours about other potions with similar effects, but they were largely dismissed as simple recipe variants of these two. Following the liberation of the Highborn territory of Reikos in 379YE however, the situation changed slightly. Recipes belonging to the Druj apothecaries known as the Buruk Tepel were captured which detailed a third, expensive and difficult to brew potion referred to as Sorrow's Mask. The potion clearly built on principles familiar to apothecaries who had mastered the Decoctions, and knowledge of how to create the elixir quickly spread after the reconquest of High Chalcis. Some scholars who have studied some of the original notes point out that it appears the original Druj recipe was considerably more difficult to make - but that they were able to refine their own processes using information extracted from Imperial apothecaries captured in Reikos.","potions":[{"name":"Decoction of the Hungry Moon","lore":"A vile-tasting elixir that chills the heart, used by some enchanters and volhov to adopt a cold mindset before dealing with Winter eternals or sovereigns.","form":"Liquid.","description":"This black, oily elixir has a thick sediment at the bottom that seems to drink in any light that hits it. It tastes vile, like rotting meat. It would require quite an effort of will for most people to drink this liquid.","roleplayingEffect":"This potion tastes unpleasantly of spoiled meat. You become emotionally cold but highly possessive and protective of your friends and allies.","mechanicalEffect":"If you possess the Winter lore skill then you gain one additional effective rank to the next Winter ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of bladeroot and true vervain, one dram of marrowort and one crystallised mana.","ingredients":{"bladeroot":2,"marrowort":1,"trueVervain":2,"manaCrystal":1},"totalIngredients":6},{"name":"The Barren Watchtower","lore":"Perfected by the necromantic Circle of the Barren Watchtower at the Necropolis; frees a ritualist from reliance on crystallised mana, at the cost of unsettling urges.","form":"Liquid.","description":"This black, oily elixir seems to drink in any light that hits it. The thick sediment at the bottom hangs in the liquid for several minutes after it is shaken up. The salty, bitter taste gives you an urge to rinse your mouth out.","roleplayingEffect":"Drinking this elixir makes you very thirsty and dry mouthed. You become cold and calculating, seeing everything in terms of cost and benefit. Individual lives or needs become meaningless in the face of your goals and what you consider to be best. You feel a powerful urge to ensure you and yours are safe, regardless of the cost to other people.","mechanicalEffect":"If you possess the Winter lore skill then you can use up to 3 personal mana as if it were crystal mana on the next Winter ritual that you perform within ten minutes.","recipe":"Three drams of bladeroot, two drams of marrowort and one dram each of Imperial roseweald, cerulean mazzarine and true vervain.","ingredients":{"bladeroot":3,"ceruleanMazzarine":1,"imperialRoseweald":1,"marrowort":2,"trueVervain":1},"totalIngredients":8},{"name":"Sorrow's Mask","lore":"A salve captured from the Druj (who reportedly used murdered humans and orcs as its base, unlike the Empire's animal-fat version) that risks drowning an inexperienced user in grief.","form":"Salve.","description":"This lumpy white salve exudes an indefinable scent that brings to mind sad memories of past loss. It tastes unspeakably horrible, and takes an effort of will to consume any.","roleplayingEffect":"Where this balm has been applied, your skin becomes numb. You are constantly reminded of your regrets; it is easy for you to succumb to feelings of grief, loss, despair, and sorrow if you do not keep focused on the task at hand.","mechanicalEffect":"If you possess the Winter lore skill then you gain three additional ranks to the next Winter ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams each of bladeroot and true vervain, one dram of marrowort, one crystallised mana, and one ring of ilium.","ingredients":{"bladeroot":3,"marrowort":1,"trueVervain":3,"manaCrystal":1,"ilium":1},"totalIngredients":9}]},{"id":"double-sided-blade","name":"Double-sided Blade","url":"https://www.profounddecisions.co.uk/empire-wiki/Double-sided_Blade","intro":"These preparations originate with the Druj orcs (or perhaps with the orcs of the Great Forest depending on who one asks). The recipes were originally captured from the Druj during the liberation of Reikos, when the herbal text of the Buruk Tepel of the Stone Toad clan fell into Imperial hands. Originally hidden behind a complex cipher, the book was eventually decoded by Imperial scholars and the recipes within revealed.\n\nIn Autumn 382YE, the recipes that comprise the Double-sided Blade were distributed to Imperial apothecaries by order of the Senate. along with several other new potion recipes. Known as The Endless Struggle among the Druj, the potions were also apparently part of the herbal lore of the Great Forest orcs - who know them as The Two-bladed Knife, and shared the recipes with the Highborn and Navarr as thanks for their assistance establishing themselves in Therunin.\n\nLike the Tonics of the Deep Forest, these preparations grant vigour and health. Unlike the more commonly known recipes, however, these two potions come with unpleasant side effects that make them less than ideal for use by Imperial citizens. Also unlike almost every other known preparation, the potions created by the Double-sided Blade are more effective when consumed by orcs than when consumed by humans. As with the more familiar potions, the Double-sided Blade preparations are tonics - meaning that one cannot enjoy their benefits in conjunction with any other tonic.\n\nThese flaws potentially limits their usefulness to ethical Imperial apothecaries, even though they are in theory easier to prepare than the equivalent Tonics of the Deep Forest. Still, as the Great Forest orcs say of the preparations: \" “These potions are like the double-bladed knife that strikes at the hand that wields it. When you must cut, you must also be cut. Sometimes your blood is the price for the victory you require.”","potions":[{"name":"Warming Armour","lore":"Known as Warspice to the Druj; empowers reckless warriors with fury and endurance, but thins the blood fatally if the effect is interrupted or wears off.","form":"Liquid.","description":"This deep crimson liquid is oddly warm to the touch. It has a strong, spicy odour and taste.","roleplayingEffect":"You feel a warmth in your belly that spreads quickly throughout your body. You feel an urge to take bloody, violent revenge on anyone you feel has wronged you.","mechanicalEffect":"You are subject to the VENOM condition. If this condition is removed prematurely, you immediately drop to 0 hits. If you are an orc, you also gain 3 additional ranks of endurance. If you are a human, you gain 2 additional ranks of endurance. The effects last until the end of the next skirmish, battle, or quest or until the VENOM is removed. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of Imperial roseweald and true vervain, one dram each of cerulean mazzarine and marrowort.","ingredients":{"ceruleanMazzarine":1,"imperialRoseweald":2,"marrowort":1,"trueVervain":2},"totalIngredients":6},{"name":"Weakening Sun","lore":"Known as Corpseskin/Oakenshield to the Druj and Great Forest orcs; a euphoric salve granting endurance at the cost of will and magic use, with a fatal risk if ended prematurely.","form":"Salve.","description":"This thick dark-blue salve is oily to the touch and absorbed quickly by the skin. It smells strongly of fresh, uncooked meat.","roleplayingEffect":"You feel a burst of euphoria that slowly fades but never goes away. Painful or uncomfortable sensations are muted, and you feel an urge to submit to anyone who you feel has authority over you.","mechanicalEffect":"You are subject to the WEAKNESS condition. If this condition is removed prematurely, you immediately drop to 0 hits. If you are an orc, you also gain 3 additional ranks of endurance. If you are a human, you gain 2 additional ranks of endurance. The effects last until the end of the next skirmish, battle, or quest, or the WEAKNESS is removed. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams each of marrowort and bladeroot, one dram each of cerulean mazzarine and true vervain.","ingredients":{"bladeroot":2,"ceruleanMazzarine":1,"marrowort":2,"trueVervain":1},"totalIngredients":6}]},{"id":"infusions-of-feathers","name":"Infusions of Feathers","url":"https://www.profounddecisions.co.uk/empire-wiki/Infusions_of_Feathers","intro":"These mystic infusions grant those who inhale them supernatural insight. They are intended to be poured into hot water and the resulting steam drawn into the lungs, from where its semi-narcotic effect flows throughout the entire body. Extensive use of these infusions can have a detrimental effect on the peace of mind of the user, and they are best employed sparingly.\n\nThese potions are, unsurprisingly, popular with the Kallavesi and with mystics of all nations. The modern recipes used to brew the infusions were refined over centuries in the swamps of Kallavesa, but the Navarr used similar preparations for centuries, and can claim the credit for first developing the Ravenwing Infusion at the very least.","potions":[{"name":"Magpie Infusion","lore":"An inhaled steam letting the user perceive magical auras and sense the qualities of a nearby ritual.","form":"Infusion.","description":"This oily blue substance smells of summer flowers. When exposed to the air, it begins to evaporate. A tiny amount on your fingertip immediately begins to bubble and soon evaporates into a thin blue-tinted cloud.","roleplayingEffect":"Your tongue and lips are numbed, meaning your speech is slurred. You find yourself blinking rapidly, or suffering from watering eyes. Any spell that you hear being cast causes you to perceive dramatic displays of colourful light that can be quite distracting.","mechanicalEffect":"Inhaling the steam from this infusion grants you the ability to use the detect magic spell once during the next ten minutes without requiring you to know the spell or expend any mana.","recipe":"Two drams of cerulean mazzarine.","ingredients":{"ceruleanMazzarine":2},"totalIngredients":2},{"name":"Ravenwing Infusion","lore":"Grants aura-reading and vivid prophetic dreams; a Highborn archivist later found it also reveals the effects of religious ceremonies without needing liao.","form":"Infusion.","description":"This crumbly red substance smells strongly of exotic spices. When rubbed between finger and thumb, the spicy scent intensifies dramatically.","roleplayingEffect":"You feel suddenly dizzy, and then lose the ability to see colours; everything becomes visible in shades of grey. The exception is that you can see colourful auras around living creatures, with the colour and intensity reflecting how you feel about that person. The night after taking this infusion, you will have exceptionally vivid dreams.","mechanicalEffect":"Inhaling the steam from this infusion grants you the ability to use the insight skill once during the next ten minutes without requiring you to know the skill or expend any liao.","recipe":"One dram each of cerulean mazzarine, Imperial roseweald, bladeroot and marrowort.","ingredients":{"bladeroot":1,"ceruleanMazzarine":1,"imperialRoseweald":1,"marrowort":1},"totalIngredients":4},{"name":"Goosewhisper Infusion","lore":"Induces a trance delivering the same symbolic visions as the Signs and Portents ritual.","form":"Infusion.","description":"This midnight blue solution is a thick, resinous liquid. It has a sweet, sharp scent that causes your nostrils to tingle and chills your lungs. The unpleasant, acrid flavour makes drinking it unappealing.","roleplayingEffect":"For around an hour after experiencing this infusion, you see things out of the corner of your eye; anyone you are not looking at directly appears to be surrounded by a shimmering multicoloured halo. You tend to see things in symbolic ways, and may see weird images hanging around people you know, relating to how you feel about them. These effects are very pronounced if you are a member of the naga lineage.","mechanicalEffect":"Inhaling the steam from this infusion causes you to enter a trance during which you suffer a brief but intense vision. This vision is provided by a referee, and will contain information about things that are happening, have happened or may happen at the event. There is no way to direct this vision towards a specific topic. These visions are the same as those received from the Signs and Portents ritual; you will receive the same vision if you are part of that ritual, have already performed it, or have already taken a dose of Goosewhisper Infusion.","recipe":"Two drams of bladeroot and one dram each of marrowort and true vervain.","ingredients":{"bladeroot":2,"marrowort":1,"trueVervain":1},"totalIngredients":4}]},{"id":"lambent-essences","name":"Lambent Essences","url":"https://www.profounddecisions.co.uk/empire-wiki/Lambent_Essences","intro":"Mastery of these recipes allows an apothecary to brew preparations valuable to ritual magicians versed in the lore of Day. With one of these potions a ritualist can wield the magic of the Day realm more effectively, but they also become more susceptible to the influence of that realm. Like the Magnum Opus, preparation of these recipes involves a slightly more alchemical than herbal approach. Herbs are carefully measured out with mithril, silver and copper spoons, sublimed in weltsilver crucibles, and distilled and condensed to draw out their essential natures.\n\nPrior to the liberation of Reikos in 379YE, Imperial apothecaries who had mastered the Lambent Essences knew how to prepare both Effulgent Primessence and Lucent Quintessence. During the rout of the Druj orcs of the Stone Toad from the Highborn territory, many documents detailing the techniques of the Buruk Tepel fell into the hands of scouts, soldiers, and adventurers alike. Some of these notes originated not with the barbarians, but with Highborn scholars of the herbal arts - and the details of Radiant Transcendence found in those notes clearly originated with a so far unnamed apothecary from High Chalcis. The potion was clearly built on principles familiar to practitioners of the Lambent Essences, and appeared to possess only minor interest for the savage Buruk Tepel. Knowledge of how to brew this potent (if expensive) new elixir quickly spread through the Empire - partially due to the work of certain Navarr stridings with an interest in magic of the Day realm.","potions":[{"name":"Effulgent Primessence","lore":"Enhances Day ritual focus, but overuse breeds a dangerous lassitude — some users have starved rather than rouse themselves.","form":"Infusion.","description":"This clear liquid glows slightly with an inner radiance even in shadow. The liquid bubbles and beings to evaporate when exposed to the air. A tiny droplet on your tongue has a delicate, delicious flavour that you cannot quite place.","roleplayingEffect":"You become calm and cerebral, fascinated by thoughts, ideas and knowledge. You are disinclined to physical action where mental action might be sufficient. Your movements and thoughts become precise and ordered.","mechanicalEffect":"If you possess the Day lore skill, then you gain one additional effective rank to the next Day ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams of marrowort and one dram each of true vervain, cerulean mazzarine and bladeroot, and one mana crystal.","ingredients":{"bladeroot":1,"ceruleanMazzarine":1,"marrowort":2,"trueVervain":1,"manaCrystal":1},"totalIngredients":6},{"name":"Lucent Quintessence","lore":"An aniseed-flavoured liquid, distilled from four herbs, that sharpens the mind's grip on Day magic's complex geometries.","form":"Liquid.","description":"This clear liquid seems to have a slightly different colour from different angles. It smells strongly of aniseed, and a tiny droplet on your tongue reveals it to have an almost overwhelming flavour of aniseed as well.","roleplayingEffect":"You become highly focused, pursuing things that interest you with stubborn doggedness. You find it difficult to show interest in things that do not engage your intellect, no matter how important it might be to others.","mechanicalEffect":"If you possess the Day lore skill then you can use up to 3 personal mana as if it were crystal mana on the next day ritual that you perform within ten minutes.","recipe":"Three drams of marrowort, two drams each of true vervain and bladeroot and one dram of cerulean mazzarine.","ingredients":{"bladeroot":2,"ceruleanMazzarine":1,"marrowort":3,"trueVervain":2},"totalIngredients":8},{"name":"Radiant Transcendence","lore":"A volatile salve, found in notes captured from Druj and Highborn apothecaries, that must be sealed immediately or self-consumes; drives an obsessive need for order that can derail a ritual through argument.","form":"Salve.","description":"There are thousands of tiny grains suspended in this translucent, oily substance. When exposed to air, the grains begin to glow faintly as the substance becomes warmer. A droplet on your tongue has a refreshing flavour.","roleplayingEffect":"This salve cleans your skin as it is absorbed. You become increasingly offended by anything you see as disordered, random, or inefficient. You feel an urge to impose order on your surroundings, and on the people around you.","mechanicalEffect":"If you possess the Day lore skill, then you gain three additional ranks to the next Day ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams of marrowort, two drams of true vervain, one dram each of cerulean mazzarine and bladeroot, one crystallised mana, and one ring of ilium.","ingredients":{"bladeroot":1,"ceruleanMazzarine":1,"marrowort":3,"trueVervain":2,"manaCrystal":1,"ilium":1},"totalIngredients":9}]},{"id":"legacy-of-thorns","name":"Legacy of Thorns","url":"https://www.profounddecisions.co.uk/empire-wiki/Legacy_of_Thorns","intro":"Mastery of these preparations allows the brewing of several toxic substances, which can hamper an enemy's ability to fight. They have been extensively used by the Navarr since time immemorial, but many societies have their own equivalents. This includes the barbarian orcs of course - the Druj of the Eastern swamps are known to make extensive use of preparations such as these when battling their Imperial enemies.\n\nNavarr apothecaries have spent centuries trying to develop a thicker version of these venoms that can be successfully applied to arrows, but to date they have made no progress.\n\nIn Autumn 382YE, the original three preparations governed by the Legacy of Thorns was expanded to include a fourth - Legionnaire's Stare - when the recipe was distributed to Imperial apothecaries by order of the Senate. This new recipe originally came from a Druj herbal captured during the liberation of Reikos, although an identical preparation was shared with the Highborn and Navarr as part of a gift of herb lore given to those two nations by the Great Forest refugees as thanks for their assistance establishing themselves in Therunin.\n\nThree of these preparations are intended to be applied to melee weapons. They cannot be used with arrows or quarrels, and are ineffective when applied to thrown weapons. They are also ineffective when applied to implements such as rods and staffs. It takes five seconds of appropriate roleplaying to apply a blade venom to a melee weapon, after which you must make the appropriate call the next time you hit a target. If ten seconds pass without making the call, the blade venom is wasted.\n\nYou cannot combine the call granted by a blade venom with any other combat or magic call; only one call is made at a time.","potions":[{"name":"Oil of Blackthorn","lore":"Known as Basilisk Ichor among the Unconquered; a blade venom especially effective against fast-healing vallorn-spawned creatures, causing the VENOM call.","form":"Oil.","description":"This thin, oily paste is the colour of grey slate. If you rub it between your finger and thumb, it has a slick texture that leaves a faint residue behind on your fingers. The oily taste is offensively and deeply unpalatable.","roleplayingEffect":"If you have drunk this oil, you are subject to nausea and painful stomach cramps for the next half hour, although if you vomit or are treated with the purify spell or by anything else that can end the weakness or venom conditions, you can alleviate these symptoms early.","mechanicalEffect":"This oil must be smeared on a melee weapon over 5 seconds. The wielder must call VENOM on the next blow with the weapon within 10 seconds.","recipe":"Two drams of bladeroot and one dram each of true vervain, cerulean mazzarine and marrowort.","ingredients":{"bladeroot":2,"ceruleanMazzarine":1,"marrowort":1,"trueVervain":1},"totalIngredients":5},{"name":"Redwillow Paste","lore":"Known as Dogman's Slather in the Marches; a blade venom used by beaters and the savage Feni alike, causing the WEAKNESS call.","form":"Oil.","description":"This rust-coloured paste smells faintly of stagnant water. It has a sticky texture if you rub it between your finger and thumb that is hard to get rid of. It has an incredibly sweet, sickly taste that is unappealing.","roleplayingEffect":"If you have drunk this oil, you are subject to the sudden onset of a feverish temperature accompanied by severe sweating, headache, tiredness and other flu-like symptoms that last for the next half hour, although if you vomit or are treated with the purify spell or by anything else that can end the weakness or venom conditions, you can alleviate these symptoms early.","mechanicalEffect":"This oil must be smeared on a melee weapon over 5 seconds. The wielder must call WEAKNESS on the next blow with the weapon within 10 seconds.","recipe":"Two drams of Imperial roseweald and one dram each of true vervain, cerulean mazzarine and marrowort.","ingredients":{"ceruleanMazzarine":1,"imperialRoseweald":2,"marrowort":1,"trueVervain":1},"totalIngredients":5},{"name":"Legionnaire's Stare","lore":"A recently-decoded Druj blade venom, known as Stonespear or Serpentooth, that fully paralyses a struck target.","form":"Oil.","description":"This odourless yellow-green paste has a sticky texture. If you rub it between your finger and thumb, it leaves a residue that is hard to get rid of. It has a metallic, earthy flavour that is surprisingly tasty.","roleplayingEffect":"If you have drunk this oil, you are subject to the sudden onset of a feverish chill accompanied by severe sweating, significant lower back pain, and a strong need to urinate that last for the next half hour, although if you vomit or are treated with the purify spell or by anything else that can end the weakness or venom conditions, you can alleviate these symptoms early.","mechanicalEffect":"This oil must be smeared on a melee weapon over 5 seconds. The wielder must call PARALYSE on the next blow with the weapon within 10 seconds.","recipe":"Three drams of bladeroot, two drams each of true vervain and marrowort, and a dose of cerulean mazzarine.","ingredients":{"bladeroot":3,"ceruleanMazzarine":1,"marrowort":2,"trueVervain":2},"totalIngredients":8},{"name":"Gutwrench","lore":"An illegal ingested poison sometimes used by corrupt apothecaries to murder patients under the guise of a healing draught; inflicts both weakness and venom.","form":"Liquid.","description":"This translucent liquid has a red-brown tinge to it and sticks viscously to the inside of the container if you shake it. It smells faintly of over-ripe pears and has a faint, tangy flavour.","roleplayingEffect":"As long as you suffer from either weakness or venom, you feel as if your stomach is on fire; you may experience other symptoms including severe sweating, feverishly elevated temperature, throbbing aches in the head and joints, tiredness, agonising stomach cramps, nausea, dizziness and painfully heightened senses that make bright lights or loud noises almost unbearable.","mechanicalEffect":"You are subject to both the weakness and venom conditions. These conditions may be removed normally.","recipe":"Two drams each of Imperial roseweald and bladeroot, and one dram of cerulean mazzarine.","ingredients":{"bladeroot":2,"ceruleanMazzarine":1,"imperialRoseweald":2},"totalIngredients":5}]},{"id":"magnum-opus","name":"Magnum Opus","url":"https://www.profounddecisions.co.uk/empire-wiki/Magnum_Opus","intro":"Mastery of these recipes allows an apothecary to brew preparations valuable to ritual magicians versed in the lore of Night. With one of these potions a ritualist can wield the magic of the Night realm more effectively, but they also become more susceptible to the influence of that realm.\n\nAs with the Lambent Essences, brewing these potions involves a somewhat more alchemical than herbal approach. The recipes also tend to be a little abstruse, using metaphor and simile rather than direct instructions on measures or processes. More than one apothecary has wasted large amounts of herbs trying to decipher the precise proportions to use.\n\nPrior to the liberation of Reikos in 379YE, Imperial masters of Magnum Opus knew how to brew Chiaroscuran Balsam and Philosopher's Stone. While rumour had suggested a third potion, anyone who might have known how to create this elusive elixir kept that knowledge a closely guarded secret. At least one of these secrets came to light after the fall of the Stone Toad citadel of Urith Barath, built in the ruins of High Chalcis. The recipe for the enigmatic Black Star was found among the effects of one of the defeated Tepel apothecaries, along with evidence that it is a widespread potion known and used extensively by the Druj. Rather than being concealed, was shared widely by the unnamed individuals who uncovered it. It clearly built on the principles used to create the Magnum Opus, and provides a powerful enhancement to the use of Night magic by the Empire.","potions":[{"name":"Chiaroscuran Balsam","lore":"A half-black, half-white salve that boosts Night ritual power but risks addictive, narcotic overuse.","form":"Salve.","description":"This mysterious ointment is half black, and half white. It has a heady, almost narcotic scent that causes the blood to pound if it is inhaled, and a smooth, oily texture that is quickly absorbed into the skin.","roleplayingEffect":"You feel giddy and excitable for several minutes after applying this balsam. You feel every emotion very strongly and have a strong urge to be gregarious, to seek out opportunities to interact with others wherever they present themselves, and want to be comfortable, well-fed and content.","mechanicalEffect":"If you possess the Night lore skill, then you gain one additional effective rank to the next Night ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams of Imperial roseweald, one dram each of true vervain, marrowort and bladeroot and one crystallised mana.","ingredients":{"bladeroot":1,"imperialRoseweald":2,"marrowort":1,"trueVervain":1,"manaCrystal":1},"totalIngredients":6},{"name":"Philosopher's Stone","lore":"A shifting two-colour elixir of murky Bregasland origin, whose unnamed original brewer vanished after multiple parties laid claim to the recipe.","form":"Liquid.","description":"This elixir holds a crimson liquid and a heavy yellow liquid. They mix when shaken creating a hypnotic suffusion of both colours that slowly separates. It seems never to smell or taste quite the same way twice.","roleplayingEffect":"This elixir has a strong taste of something (practically any taste is possible). You feel a strong urge to be mysterious and enigmatic; to avoid direct answers, to conceal your intentions and to couch your speech in allusion and metaphor. Direct answers and direct solutions are unsatisfying.","mechanicalEffect":"If you possess the Night lore skill then you can use up to 3 personal mana as if it were crystal mana on the next Night ritual that you perform within ten minutes.","recipe":"Three drams of Imperial roseweald, two drams each of bladeroot and cerulean mazzarine and one dram of true vervain.","ingredients":{"bladeroot":2,"ceruleanMazzarine":2,"imperialRoseweald":3,"trueVervain":1},"totalIngredients":8},{"name":"Black Star","lore":"Recovered from a defeated Stone Toad apothecary after the fall of Urith Barath; instils an unsettling, escalating sense of hidden conspiracy.","form":"Liquid.","description":"This milky white liquid swirls like trapped smoke. Black motes appear in the depths, becoming more distinct if it is shaken. It has a strong aroma of ripe fruit, but a droplet on the tongue tastes unpleasantly bitter.","roleplayingEffect":"You are filled with a growing sense that there is a conspiracy at work around you. It is easy to start speculating on the secret schemes that underlie anything from the performance of your ritual, to the formation of your coven, to the choice of clothing a stranger has made.","mechanicalEffect":"If you possess the Night Lore skill, then you gain three additional ranks to the next Night ritual that you perform within ten minutes, subject to the normal rules for effective skill. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Three drams of Imperial roseweald, two drams of bladeroot, one dram each of true vervain and marrowort, one crystallised mana, and one ring of ilium.","ingredients":{"bladeroot":2,"imperialRoseweald":3,"marrowort":1,"trueVervain":1,"manaCrystal":1,"ilium":1},"totalIngredients":9}]},{"id":"master-medicinal","name":"Master Medicinal","url":"https://www.profounddecisions.co.uk/empire-wiki/Master_Medicinal","intro":"While any skilled apothecary can prepare medicinal elixirs, the students of the Master Medicinal learn to make specialist potions that expand on the basic knowledge shared by all students of herbalism.","potions":[{"name":"Tranquil Nostrum","lore":"Known as Tom Drake's Tea in the Marches; a bitter restorative tea that speeds healing and calms troubled soldiers between battles.","form":"Liquid.","description":"This yellow-green liquid clings viscously to the inside of the container. It has a sweet scent, but a tiny drop on your tongue reveals it to be extremely bitter, and a little salty.","roleplayingEffect":"You feel lethargic, sleepy and relaxed, disinclined to be active or aggressive.","mechanicalEffect":"This preparation is used to brew a pot of tea. Each person drinking a cup of the tea recovers all lost hits after fifteen minutes of rest and relaxation. There is no effect if the drinker is on a battlefield or similar stressful environment. If the drinker attacks a target or is attacked during this time then the effect is negated. The tea loses its beneficial properties fifteen minutes after being brewed regardless.","recipe":"One dram each of marrowort and bladeroot.","ingredients":{"bladeroot":1,"marrowort":1},"totalIngredients":2},{"name":"Maledict's Medicament","lore":"A foul elixir favoured against Druj or Varushkan foes, purging both venom and weakness.","form":"Liquid.","description":"This deep crimson liquid has a thin layer of scummy froth atop it. It smells unpleasant, and has an oily texture. A drop on your tongue makes you salivate – it is vile and you feel a strong urge to spit the mixture out.","roleplayingEffect":"You feel nauseous and dizzy; you may be overcome with retching and vertigo for a few moments.","mechanicalEffect":"You are relieved of both the venom and the weakness conditions.","recipe":"One dram each of cerulean mazzarine, bladeroot, and Imperial roseweald.","ingredients":{"bladeroot":1,"ceruleanMazzarine":1,"imperialRoseweald":1},"totalIngredients":3},{"name":"The Sovereign Specific","lore":"The pinnacle of the apothecary's art — a near-miraculous cure-all restoring vitality, mending wounds, and purging poison, prized for its versatility despite being difficult to brew.","form":"Liquid.","description":"This clear liquid seems almost to sparkle when it is shaken or held up to the light. It smells fresh and a little minty. A drop on your tongue reveals it to have a vibrant, pleasant taste.","roleplayingEffect":"You feel lightheaded for a moment, then refreshed and full of energy, and an incredible sense of wellbeing suffuses you. It is hard not to be filled with optimism and enthusiasm.","mechanicalEffect":"This potion removes the venom and weakness conditions from you, restores all limbs ruined by cleave or impale, and restores you to full hits. You may ignore the roleplaying effects of any traumatic wounds you are suffering until the end of the battle.","recipe":"Three drams of true vervain, and one dram each of Imperial roseweald, cerulean mazzarine, bladeroot, and marrowort.","ingredients":{"bladeroot":1,"ceruleanMazzarine":1,"imperialRoseweald":1,"marrowort":1,"trueVervain":3},"totalIngredients":7}]},{"id":"philtres-of-the-high-peaks","name":"Philtres of the High Peaks","url":"https://www.profounddecisions.co.uk/empire-wiki/Philtres_of_the_High_Peaks","intro":"It should come as little surprise that the philtres of the high peaks were first codified by the Urizen, but the original recipes themselves date back to the time of Terunael. The Urizen refined and developed them over the course of several centuries, improving their potency and efficiency, and by the time they joined the Empire the preparations were in the form they exist today.\n\nThese potions restore personal mana. They will not give a character personal mana if they do not already possess it, and they will not raise personal mana above the maximum set by skills and crafted items.","potions":[{"name":"Mageblood","lore":"Originally the Philtre of Celestial Excellence, renamed for its salty taste and popularity among healers.","form":"Philtre.","description":"This red liquid contains tiny particles of pale material suspended within it. It is very thick, and smells faintly of copper. A tiny droplet on your tongue reveals it to have a surprisingly salty flavour.","roleplayingEffect":"You feel an urge to gaze in wonder at the world around you for a few moments.","mechanicalEffect":"You regain up to 2 points of spent personal mana. If you do not have personal mana, the preparation has no effect.","recipe":"One dram each of true vervain and Imperial roseweald.","ingredients":{"imperialRoseweald":1,"trueVervain":1},"totalIngredients":2},{"name":"The Philtre of Heavenly Lore","lore":"A violet elixir likened to a starry sky, sometimes needlessly dosed with precious-metal shavings by superstitious apothecaries.","form":"Philtre.","description":"This thin liquid has a startlingly violet hue. It smells faintly medicinal, like cough syrup. A tiny droplet of this oily fluid on your tongue reveals it to have a tangy, citrus flavour.","roleplayingEffect":"You feel a strong urge to gather magical power, items and knowledge.","mechanicalEffect":"You regain up to 6 points of personal mana. If you do not have personal mana, this preparation has no effect.","recipe":"Two drams each of Imperial roseweald and bladeroot, and one dram of cerulean mazzarine.","ingredients":{"bladeroot":2,"ceruleanMazzarine":1,"imperialRoseweald":2},"totalIngredients":5},{"name":"The Elixir of Empyrean Art","lore":"First given as a wedding gift by Callidius of Wealdawn; dissolves star-metal ilium to restore mana, with some evidence of addictive craving.","form":"Liquid.","description":"This silvery liquid is filled with tiny bubbles. If you shake the container it effervesces energetically and seems to sparkle like polished glass. It has no aroma but tasting it makes your tongue tingle almost expectantly.","roleplayingEffect":"You are filled with almost painful amounts of magical power. As long as you have personal mana remaining, you feel a strong urge to perform magic as often as possible. When the effects wear off, you feel a vague urge to sample them again.","mechanicalEffect":"You regain all your spent personal mana, and gain an additional 2 points of temporary personal mana. These temporary points are the first ones spent when you spend personal mana. If you have not used these temporary points within half an hour, they are lost. If you do not have personal mana, this preparation has no effect.","recipe":"Three drams of bladeroot, two drams each of Imperial roseweald and cerulean mazzarine, one dram of true vervain, and a single ring of ilium.","ingredients":{"bladeroot":3,"ceruleanMazzarine":2,"imperialRoseweald":2,"trueVervain":1,"ilium":1},"totalIngredients":9},{"name":"Thresher's Tea","lore":"Known as Tisane of the Stuttering Fool; a narcotic tea that strips a magician's personal mana, often used to punish or neutralise dangerous spellcasters.","form":"Liquid.","description":"This pale green liquid clings viscously to the inside of the container when you shake it. It smells strongly of spice and summer flowers. A droplet on your finger or tongue causes the tip to tingle, almost expectantly.","roleplayingEffect":"You are confused, unable to concentrate properly or focus your thoughts for at least the next ten minutes.","mechanicalEffect":"If you have any personal mana, you immediately lose it all. You can regain personal mana normally.","recipe":"Two drams of cerulean mazzarine, and one dram each of marrowort and true vervain.","ingredients":{"ceruleanMazzarine":2,"marrowort":1,"trueVervain":1},"totalIngredients":4}]},{"id":"philtres-of-war","name":"Philtres of War","url":"https://www.profounddecisions.co.uk/empire-wiki/Philtres_of_War","intro":"The Philtres of War are popular with soldiers and warriors throughout the Empire. They invigorate personal reserves and strengthen the body, as well as helping to focus the will.\n\nThese potions restore spent hero points; they will not give a character hero points if they do not already possess them.","potions":[{"name":"Philtre of Strength","lore":"Restores a spent hero point; most valuable to those with the smallest reserves of personal power.","form":"Philtre.","description":"This translucent liquid has a faint blue tinge. It has a rich, spicy scent, but a tiny droplet on your tongue discovers it to have a surprisingly sweet flavour.","roleplayingEffect":"You feel all your cares and worries fall away; you feel a strong urge to shout, bellow or sing something as you are suddenly invigorated.","mechanicalEffect":"You regain one spent hero point. If you have no hero points this potion has no effect.","recipe":"Two drams of true vervain and one dram of bladeroot.","ingredients":{"bladeroot":1,"trueVervain":2},"totalIngredients":3},{"name":"Skop's Mead","lore":"Legendarily brewed from honey tricked from a Summer Lord by a Suaq icewalker; restores hero points and inspires allies.","form":"Philtre.","description":"This deep amber syrup clings viscously to the inside of the container, and when it catches the light it seems to glow. It smells sweet, and a sticky droplet on your tongue reveals it to have the sweet flavour of fine honey.","roleplayingEffect":"You feel a burst of renewed energy, and an urge to act immediately in pursuit of your goals. You also feel a strong urge to share your confidence with, and raise the morale of, your allies - to inspire others to follow your lead.","mechanicalEffect":"You regain three spent hero points. If you have no hero points this potion has no effect.","recipe":"Three drams of true vervain, two drams each of Imperial roseweald and bladeroot, and one dram of marrowort.","ingredients":{"bladeroot":2,"imperialRoseweald":2,"marrowort":1,"trueVervain":3},"totalIngredients":8},{"name":"Elixir of Exalted Puissance","lore":"A rare, ilium-based elixir first formulated in Urizen by Coriana of Sunspire; fully restores hero points plus a bonus temporary one.","form":"Liquid.","description":"This deep green liquid is filled with tiny bubbles; if you shake the container it effervesces energetically. It smells strongly of mint, and a tiny droplet on your finger or tongue causes the tip to tingle almost expectantly.","roleplayingEffect":"You are filled with a sensation of immense confidence and belief in your own abilities. You want to demonstrate your prowess to everyone.","mechanicalEffect":"You regain all your spent hero points, and gain an additional temporary hero point. This temporary point is the first one spent when you spend hero points. If you have not used this temporary hero point within half an hour, it is lost. If you do not have hero points, this preparation has no effect.","recipe":"Three drams of Imperial roseweald, two drams each of true vervain and bladeroot, a dram of marrowort and a single ring of ilium.","ingredients":{"bladeroot":2,"imperialRoseweald":3,"marrowort":1,"trueVervain":2,"ilium":1},"totalIngredients":9},{"name":"Tincture of the Whipped Cur","lore":"A poison that strips all hero points, with a mixed history of both treachery and heroic use across the Empire.","form":"Liquid.","description":"This amber syrup clings viscously to the inside of the container, and when it catches the light it glistens like fine oil. It smells very sweet, but a sticky droplet on your tongue reveals it to have a surprisingly bitter flavour.","roleplayingEffect":"You are filled with self-doubt and uncertainty for at least ten minutes.","mechanicalEffect":"You immediately lose all your hero points. You can regain hero points normally.","recipe":"Two drams of bladeroot and one dram each of cerulean mazzarine and marrowort.","ingredients":{"bladeroot":2,"ceruleanMazzarine":1,"marrowort":1},"totalIngredients":4}]},{"id":"runa-s-gift","name":"Runa's Gift","url":"https://www.profounddecisions.co.uk/empire-wiki/Runa%27s_Gift","intro":"These preparations originate with the Yerende, now one of the septs of the Imperial Orcs. These recipes were preserved for generations amongst the sept whilst they served under the Druj in Ossium. Once the Palace of Flowers was constructed, and the sept joined the nation, work was put into disseminating the recipes across the Empire. The project was completed after the Winter Solstice 385YE, and following the completion of the Feldspar Distillery, they became available for all Imperial apothecaries to learn shortly before the Winter Solstice 386YE. These potions and tonics share a property with the recipes that make up the Unshackled Gift in that they are effective only when consumed by orcs; humans who try to use one of these preparations merely suffer from potentially unfortunate side effects.\n\nThe Yerende kept this knowledge from the Druj for several reasons, but one is that their apothecaries and shamans share a belief that the potions help an orc, especially an orc magician, draw on the strength of their ancestors who urge them to create the Great Garden. According to some of their number, they feared that if the orcs of the Mallum gained access to this lore, it would help their Vikari and Ghulai make contact with the malicious and corrupt magicians of their own septs, helping them to find the magical power to reshape the world into a dark mirror of the Great Garden, a place of endless suffering and fear.","potions":[{"name":"Greenmaster's Reach","lore":"Named for a Yerende Greenmaster who once turned a battle against the Druj at the cost of their own life; lets an orc magician cast Repel or Entangle freely.","form":"Liquid.","description":"This thick, orange liquid leaves streaks on the inside of the container. It has a consistency similar to honey with a strong, meaty taste.","roleplayingEffect":"If you are an orc, you feel a surge of conviction of your past actions; you are strongly aware of the voices of those ancestors that encourage you to strengthen yourself or improve your status, urging you to surpass what you have achieved so far. If you are a human, you feel a dizzying sense of euphoria that slowly builds. At the same time you feel your senses becoming keener until any strong sensory stimulation becomes almost painful.","mechanicalEffect":"If you are an orc and you have the magician skill, you can cast either Repel or Entangle once without expending personal mana or crystal mana within 10 seconds. You do not need to be able to cast either spell to benefit from this effect. If you are a human, or an orc who does not have the magician skill, the potion has no mechanical effect.","recipe":"One dram each of realmsroot and Imperial roseweald.","ingredients":{"imperialRoseweald":1,"realmsroot":1},"totalIngredients":2},{"name":"Brokendraught","lore":"Said to channel the Yerende ancestor Maren; grants a free cast of Restore Limb or Shatter.","form":"Liquid.","description":"This green liquid has tiny pale flecks floating within it. It smells strongly of blood, and a tiny droplet on your tongue reveals it tastes strongly of liquorice.","roleplayingEffect":"If you are an orc, you feel a sense of power surge through you that quickly becomes almost overwhelming. You feel empowered to take action, doubts and worries feel distant and indistinct. Taking action to reduce or prevent suffering or pain feels righteous and empowering, and after the effect ends you may experience a craving to feel it again. If you are human, you become increasingly certain that you can \"smell\" magic around you as your senses shift and become unreliable. You quickly become disoriented and confused, unsure of what is real and what is a hallucination.","mechanicalEffect":"If you are an orc and you have the magician skill, you can swift cast either Restore Limb or Shatter once without expending personal mana or crystal mana within 10 seconds. You do not need to be able to cast either spell to benefit from this effect. If you are a human, or an orc that does not have the magician skill, the potion has no mechanical effect.","recipe":"One dram each of realmsroot and cerulean mazzarine.","ingredients":{"ceruleanMazzarine":1,"realmsroot":1},"totalIngredients":2},{"name":"Runa's Whisper","lore":"Reputedly stolen wholesale from the Druj by Runa the Soft-Speaker; grants a free cast of Venom or Purify.","form":"Liquid.","description":"This gloopy, brown concoction adheres to the inside of the container. It has a strong earthy scent, but a drop on your tongue reveals it to be cloyingly sweet.","roleplayingEffect":"If you are an orc, you are reminded of the fragility and value of life; seeing loved ones at risk can feel physically painful. It is easy for you to see the importance of life for strangers and even enemies; whatever your spiritual beliefs it is hard to escape the knowledge that once ended a life can never be regained. If you are human, you feel numbed to grief, sorrow, and suffering, and may experience moments of intense introspection. You may lose all interest in the outside world for a time, focusing entirely on your own feelings and thoughts.","mechanicalEffect":"If you are an orc and you have the magician skill, you can swift cast either Venom or Purify once without expending personal mana or crystal mana within 10 seconds. You do not need to be able to cast either spell to benefit from this effect. If you are a human, or an orc who does not have the magician skill, the potion has no mechanical effect.","recipe":"One dram each of realmsroot and bladeroot.","ingredients":{"bladeroot":1,"trueVervain":1,"realmsroot":1},"totalIngredients":2},{"name":"Tender's Path","lore":"Named for the Great Garden and known as Hemby's Folly when misused; grants a free cast of Heal or Empower, but can overwhelm an unprepared orc with awareness of their social bonds.","form":"Liquid.","description":"This sticky, orange liquid smells strongly of overripe mango. A drop on your tongue reveals it to taste unbelievably spicy.","roleplayingEffect":"If you are an orc, you feel invigorated by the bonds of connection to your closest supporters. You are keenly aware of the connections you share with others and how they affect your life. It is easy to become overwhelmed by an awareness of your place in the world. If you are human, you initially feel exhilarated and full of energy, each new experience is incredibly exciting. This quickly becomes overwhelming, making it hard to speak coherently or focus on anything for more than a few moments.","mechanicalEffect":"If you are an orc and you have the magician skill, you can swift cast either Heal or Empower once without expending personal mana or crystal mana within 10 seconds. You do not need to be able to cast either spell to benefit from this effect. If you are a human, or an orc who does not have the magician skill, the potion has no mechanical effect.","recipe":"One dram each of realmsroot and true vervain.","ingredients":{"trueVervain":1,"realmsroot":1},"totalIngredients":2},{"name":"Clodden Earth","lore":"A soil-mixed ointment painted in ritual patterns before a fight, often symbolising flowers like the Shire Rose; grants bonus mana to orc magicians.","form":"Salve.","description":"This greasy, pale ointment has an odour of rotting wood. It is quickly absorbed into the skin, and it tastes of rancid fruit.","roleplayingEffect":"If you are an orc, you become aware of a reservoir of magical power that lies just out of reach. If you push yourself, if you can gather sufficient power, you could achieve anything, change anything, create anything. If you are human, you are vividly reminded of times when you feel you failed yourself or others, and times when other people let you down. It is easy to feel guilty, or lash out at others, but the idea that anyone might be able to make amends for their mistakes feels alien and naïve.","mechanicalEffect":"If you are an orc with the magician skill, you gain two additional personal mana. Whether you are a magician or not, this counts as a source of spiritual strength to overcome roleplaying effects. If you are a human, the potion has no mechanical effect. The effects - mechanical and roleplaying - last until the end of the next skirmish, quest, or battle, or until sunrise, whichever comes first. This is a tonic; the effect of any other tonic you have drunk immediately ends.","recipe":"Two drams of Imperial roseweald, and one dram each of true vervain and realmsroot.","ingredients":{"imperialRoseweald":2,"trueVervain":1,"realmsroot":1},"totalIngredients":4}]},{"id":"the-assassin-s-gate","name":"The Assassin's Gate","url":"https://www.profounddecisions.co.uk/empire-wiki/The_Assassin%27s_Gate","intro":"The poisons known as The Assassin's Gate are as straightforward as they are lethal. The Black Gate attacks the stomach, kidney, liver and most importantly the brain, causing terrifying hallucinations and then killing the target. The Crimson Gate by contrast attacks the lungs, the heart and the blood vessels causing uncontrollable bleeding.\n\nBoth substances are illegal within the Empire; possession of either is generally viewed by the Imperial Magistrates as intent to commit murder. The antidote for both the Black Gate and the Crimson is an infusion called the Silver Key. It purges the symptoms of either or both poisons if they are present, meaning it is pointless to try and poison someone with both preparations.\n\nSee the section on poisons for more details of how these horrible substances, and their antidote, are used.","potions":[{"name":"The Black Gate","lore":"A fast-acting, illegal poison attacking the stomach, kidneys, liver and brain, causing hallucinations before a fatal seizure.","form":"Liquid.","description":"This clear, odourless, tasteless liquid appears indistinguishable from water.","roleplayingEffect":"You feel dizzy and enervated. Over the next fifteen minutes you become increasingly confused, suffering random aches and pains and a growing awareness of your own death. You may occasionally hallucinate that people around you are friends, loved ones or dead relatives.","mechanicalEffect":"You are immediately affected by weakness which cannot be removed until the poison is cured. After ten minutes you can no longer move under your own power and cannot attack, defend yourself or use any abilities or items. At the end of thirty minutes you suffer an agonising seizure and die.","recipe":"Four drams of bladeroot and three drams each of true vervain and marrowort.","ingredients":{"bladeroot":4,"marrowort":3,"trueVervain":3},"totalIngredients":10},{"name":"The Crimson Gate","lore":"A fast-acting, illegal poison attacking the lungs and blood vessels, causing uncontrollable bleeding and death.","form":"Liquid.","description":"This fine, odourless, tasteless liquid appears indistinguishable from water.","roleplayingEffect":"You feel very warm and thirsty, quickly developing a raging fever. Over the next fifteen minutes you begin to suffer agonising pain in your joints and muscles, and begin to cough up blood, You have difficulty breathing, and a growing awareness of your own death. You begin to bleed from the eyes and nose.","mechanicalEffect":"You are immediately affected by venom which cannot be removed until the poison is cured. After ten minutes you can no longer move under your own power and cannot attack, defend yourself or use any abilities or items. At the end of thirty minutes you die, either drowning on your own blood or from massive internal haemorrhaging.","recipe":"Four drams of Imperial roseweald and three drams each of true vervain and cerulean mazzarine.","ingredients":{"ceruleanMazzarine":3,"imperialRoseweald":4,"trueVervain":3},"totalIngredients":10},{"name":"The Silver Key","lore":"An infusion antidote that purges either Gate poison through violent vomiting or coughing, but worsens other poisons if none is present.","form":"Infusion.","description":"This grey solution is a thick, resinous liquid. It has an acrid, burning scent that brings on coughing and chills the lungs. The overpowering, acidic flavour makes drinking it unappealing.","roleplayingEffect":"You begin to cough uncontrollably, and after a few moments will vomit until your stomach is empty. You may lose consciousness. Over the next five minutes the symptoms of either The Black Gate or The Crimson Gate quickly recede.","mechanicalEffect":"Removes the effect of either or both of The Black Gate or The Crimson Gate. The weakness and venom effects need to be removed separately. If you are not poisoned, you are reduced to 0 hits by this unpleasant preparation.","recipe":"Four drams each of Imperial roseweald, bladeroot and marrowort, two drams of true vervain, and one dram of cerulean mazzarine.","ingredients":{"bladeroot":4,"ceruleanMazzarine":1,"imperialRoseweald":4,"marrowort":4,"trueVervain":2},"totalIngredients":15}]},{"id":"the-last-resort","name":"The Last Resort","url":"https://www.profounddecisions.co.uk/empire-wiki/The_Last_Resort","intro":"These foul preparations originate with the Druj orcs. The recipes were originally captured from the Druj during the liberation of Reikos, when the herbal text of the Buruk Tepel of the Stone Toad clan fell into Imperial hands. Originally hidden behind a complex cipher, the book was eventually decoded by Imperial scholars and the recipes within revealed.\n\nIn Autumn 382YE, the recipes that comprise the Last Resort were distributed to Imperial apothecaries by order of the Senate. along with several other new potion recipes. Known as The Buruk's Blade among the Druj, the poisons are apparently used by master apothecaries in the Mallum to dispatch their opponents.\n\nFor obvious reasons, Imperial apothecaries have not undertaken much experimentation with these preparations. Much of what is known about them and their symptoms comes directly from the captured Stone Toad herbal.\n\nAs of the 385YE Winter Solstice, the poisons Watery Grave, Python's Hug, and Hooded Misery are illegal within the Empire; the Imperial Magistrates generally view possession of either as intent to commit murder. See the section on poisons for more details on how these horrible substances, and their antidote, are used.","potions":[{"name":"Watery Grave","lore":"Known as Ashwater to the Druj; an illegal poison causing severe dehydration and organ failure over thirty minutes.","form":"Liquid.","description":"This clear, odourless, tasteless liquid appears indistinguishable from water.","roleplayingEffect":"You feel nauseous and unwell. Over the next fifteen minutes you feel dehydrated and suffer stabbing stomach pains and vomiting. Your bowel movements are voluminous and watery. Your breathing becomes laboured.","mechanicalEffect":"You are immediately affected by WEAKNESS that cannot be removed until the poison is cured. After ten minutes your blood is viscous and foul smelling and your bleed time is increased by three minutes. At the end of thirty minutes your organs collapse leading to a fatal collapse.","recipe":"Four drams of bladeroot, and two drams each of true vervain, cerulean mazzarine, and marrowort.","ingredients":{"bladeroot":4,"ceruleanMazzarine":2,"marrowort":2,"trueVervain":2},"totalIngredients":10},{"name":"Python's Hug","lore":"Known as Gutwreck to the Druj; an illegal poison causing internal twisting and eventual ruptured entrails.","form":"Liquid.","description":"This clear, odourless, tasteless liquid appears indistinguishable from water.","roleplayingEffect":"You feel warm and unwell. After five minutes, you suffer a nosebleed, headache, and abdominal pain. After fifteen minutes you are enervated and feverish and barely able to move, feeling as if your guts are twisting inside you.","mechanicalEffect":"After fifteen minutes you are unable to move unaided, attack, defend, or use any skill or magical item unless it explicitly says that it can be used while dying. You may be fed a potion by another character. After thirty minutes, your organs rupture bloodily leading to a painful death.","recipe":"Four drams of Imperial roseweald, and two drams each of marrowort, bladeroot, and true vervain.","ingredients":{"bladeroot":2,"imperialRoseweald":4,"marrowort":2,"trueVervain":2},"totalIngredients":10},{"name":"Restless Slumber","lore":"Known as Deathsleep to the Druj; the antidote to Watery Grave and Python's Hug, inducing deep unconsciousness — fatal if applied to the wrong poison.","form":"Salve.","description":"This thin, tan salve is unpleasantly greasy to the touch. It smells of spoiled offal.","roleplayingEffect":"You experience a powerful chill and over the next few minutes lose consciousness. Over the next five minutes the symptoms of either Watery Grave or Python's Hug poisons quickly recede.","mechanicalEffect":"Removes the effect of either or both Watery Grave and Python's Hug. You are left subject to both venom and weakness, regardless. If you were not poisoned, you are weakened and envenomed by this unpleasant preparation.","recipe":"Five drams each of Imperial roseweald, bladeroot, and true vervain.","ingredients":{"bladeroot":5,"imperialRoseweald":5,"trueVervain":5},"totalIngredients":15},{"name":"Hooded Misery","lore":"Known as Brackblood to the Druj; a contagious, multi-day wasting sickness (the 'Reikos Flux') refined from Watery Grave — only a Bloodharrow Philtre can cure it, as other remedies make it worse.","form":"Liquid.","description":"This red liquid is thick and viscous, with crushed herbal particles clearly visible within it. It smells almost overpoweringly of fish.","roleplayingEffect":"This vile tasting liquid causes you to feel nauseous and unwell for several minutes.","mechanicalEffect":"If you have drunk this vile tasting liquid, you should show this lammy to a referee as soon as possible.","recipe":"Four drams of bladeroot, and a dram each of true vervain, cerulean mazzarine, and marrowort.","ingredients":{"bladeroot":4,"ceruleanMazzarine":1,"marrowort":1,"trueVervain":1},"totalIngredients":7}]},{"id":"the-winter-moon","name":"The Winter Moon","url":"https://www.profounddecisions.co.uk/empire-wiki/The_Winter_Moon","intro":"The poisons known as The Winter Moon are sinister and somewhat supernatural poisons that combine the effects of a terrible curse with a cruel lethality. The Virus Lunarae attacks the spirit, casing a slow, numbing chill but the vile effectiveness of this venom does not end with death - the corpse of the victim soon reanimates as a flesh-hungry husk and attacks friends and family gathered around the sickbed. The Hunger of the Wolf drives the target increasingly mad, culminating in a bloody rampage that ends only when the poor victim is dead. Both poisons work by causing a fundamental imbalance in the body and mind - and some say spirit - of the victim.\n\nBoth substances are illegal within the Empire; possession of either is generally viewed by the Imperial Magistrates as intent to commit murder. The antidote for both the Virus Lunarae and the Hunger of the Wolf is an infusion called the Feast for Crows. It purges the symptoms of either or both poisons if they are present, meaning it is pointless to try and poison someone with both preparations.\n\nSee the section on poisons for more details of how these horrible substances, and their antidote, are used.","potions":[{"name":"Virus Lunarae","lore":"An illegal poison that numbs and kills the victim, then reanimates their corpse as a flesh-hungry undead husk.","form":"Liquid.","description":"This clear, odourless, tasteless liquid appears indistinguishable from water.","roleplayingEffect":"You feel a growing chill spreading through your body. Over the next fifteen minutes you become increasingly cold and numb; shivering despite all efforts to keep you warm. You lose all sensation in your extremities, and eventually are incapable of feeling any physical sensation or holding anything in your numb fingers. You also become increasingly incoherent, and will tend to babble incomprehensibly as the symptoms worsen.","mechanicalEffect":"You are immediately affected by weakness which cannot be removed until the poison is cured. After ten minutes you can no longer move under your own power and cannot attack, defend yourself or use any abilities or items. At the end of thirty minutes you slip into a coma from which you will never recover. A few minutes after that, you reanimate as a flesh-hungry zombie bent on killing and devouring the living.","recipe":"Three drams each of marrowort and cerulean mazzarine, and two drams each of true vervain and bladeroot.","ingredients":{"bladeroot":2,"ceruleanMazzarine":3,"marrowort":3,"trueVervain":2},"totalIngredients":10},{"name":"Hunger of the Wolf","lore":"An illegal poison driving the victim to a final murderous frenzy while preventing their blood from clotting.","form":"Liquid.","description":"This clear, odourless, tasteless liquid appears indistinguishable from water.","roleplayingEffect":"You feel a growing heat spreading through your body. Over the next fifteen minutes you become extremely short tempered, often incoherent with rage, and lash out at anyone who annoys you. Your growing rage makes it harder and harder for you to concentrate; you begin to hear voices urging you to kill everyone around you.","mechanicalEffect":"You are immediately affected by venom which cannot be removed until the poison is cured. After ten minutes you can no longer communicate coherently with others, and become extremely violent. After thirty minutes you may choose to either enter a killing frenzy or suffer a fatal brain haemorrhage. You will never recover from this state.","recipe":"Four drams each of Imperial roseweald and true vervain, and two drams of bladeroot.","ingredients":{"bladeroot":2,"imperialRoseweald":4,"trueVervain":4},"totalIngredients":10},{"name":"Feast for Crows","lore":"A salve antidote to either Winter Moon poison, though it worsens other poisons if none is present.","form":"Salve.","description":"This lumpy red balm has a texture similar to that of rotting meat soaked in blood. It is quickly absorbed into the skin, leaving red marks behind.","roleplayingEffect":"You are overwhelmed by alternating burning fever and freezing numbness that completely incapacitates you. You may lose consciousness, and suffer painful convulsions. Over the next five minutes the symptoms of either Virus Lunarae or Hunger of the Wolf quickly recede.","mechanicalEffect":"Removes the effect of either or both of Virus Lunarae or Hunger of the Wolf. The weakness and venom effects need to be removed separately. If you are not poisoned, you are reduced to 0 hits by this unpleasant preparation.","recipe":"Four drams each of marrowort and cerulean mazzarine, three drams each of bladeroot and Imperial roseweald and one dram of true vervain.","ingredients":{"bladeroot":3,"ceruleanMazzarine":4,"imperialRoseweald":3,"marrowort":4,"trueVervain":1},"totalIngredients":15}]},{"id":"tisanes-of-the-labyrinth","name":"Tisanes of the Labyrinth","url":"https://www.profounddecisions.co.uk/empire-wiki/Tisanes_of_the_Labyrinth","intro":"These preparations are of special interest to the priests of The Way. Each of these preparations uses liao, and consequently those apothecaries who master them usually require the assistance of someone with access to that comparatively rare preparation, Under normal circumstances this means a priest with a congregation as a resource.","potions":[{"name":"Usher's Decoction","lore":"Enhances a priest's next ceremony by one rank; drinkers report vivid dreams some scholars believe are borrowed from past lives.","form":"Liquid.","description":"When this pale orange liquid catches the light it seems to glow. It has a light, spicy scent. A tiny droplet of this thin fluid
