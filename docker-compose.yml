version: '3.8'

services:
  php:
    build: .
    container_name: nqh_php
    volumes:
      - .:/var/www
    working_dir: /var/www

  nginx:
    image: nginx:latest
    container_name: nqh_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
